name: Elapsed
options:
  bundleIdPrefix: com.ta21cos
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"
  minimumXcodeGenVersion: "2.30"
  projectVersion: "1"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Elapsed:
    type: application
    platform: macOS
    sources:
      - Elapsed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ta21cos.Elapsed
        INFOPLIST_FILE: Elapsed/Info.plist
        CODE_SIGN_ENTITLEMENTS: Elapsed/Elapsed.entitlements
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: Elapsed
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Elapsed/Elapsed.entitlements

  ElapsedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ElapsedTests
    dependencies:
      - target: Elapsed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ta21cos.ElapsedTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Elapsed.app/Contents/MacOS/Elapsed"
