name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Elapsed/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Elapsed/Info.plist

      - name: Build Release
        run: |
          xcodebuild -project Elapsed.xcodeproj \
            -scheme Elapsed \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Re-sign app bundle
        run: codesign --force --deep --sign - build/Build/Products/Release/Elapsed.app

      - name: Create zip
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Elapsed.app Elapsed-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/Elapsed-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: true
